# Check the data and the pages, then publish the site on GitHub Pages.
# Runs on every push to main, and by hand (Actions tab → "Check and deploy to GitHub Pages" →
# Run workflow). Needs Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Action versions: latest major releases, checked on 2026-11-22.
name: Check and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read-only by default; only the deploy job may write to Pages.
permissions:
  contents: read

# One deployment at a time; a running deployment is not cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          # Same minor version as python3.12 on LiSC. The simulator gives byte-identical
          # output on Python 3.9 to 3.14 (tested on LiSC).
          python-version: "3.12"

      - name: Data checks
        run: python scripts/check_data.py

      - name: Site checks
        run: python scripts/check_site.py

      - name: Reproducibility guard (the published data are exactly the simulated data)
        run: bash scripts/check_reproducible.sh

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/configure-pages@v6

      - name: Copy only the files the site needs into _site/
        run: |
          set -euo pipefail
          mkdir _site
          while IFS= read -r path; do
            case "$path" in ''|'#'*) continue ;; esac
            cp -R -- "$path" _site/
          done < scripts/site_files.txt
          echo "Published files:"
          find _site -type f | LC_ALL=C sort

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
